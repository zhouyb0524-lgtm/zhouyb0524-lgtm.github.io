const projects=[{"title": "企业知识问答与 OA 流程助手", "kind": "企业 AI 应用", "desc": "把分散的企业文档、业务知识和流程说明整理到自然语言入口，让员工更容易找到信息并了解下一步操作。", "details": "<p><strong>关注的问题：</strong>知识分散、查找耗时，找到说明之后仍不清楚如何办理。</p><p><strong>方案重点：</strong>文档结构化、知识切片、检索与回答策略，以及结合业务场景的流程引导。</p>"}, {"title": "AI 销售训练系统", "kind": "对话训练与反馈", "desc": "通过不同客户画像和模拟对话，让销售人员练习需求挖掘、异议处理与成交推进，并获得可用于下一次练习的反馈。", "details": "<p><strong>关注的问题：</strong>熟悉销售知识，不代表能在真实对话里有效应对客户。</p><p><strong>方案重点：</strong>客户画像、场景化对话、评价反馈与训练记录，连接练习、反馈和再次练习。</p>"}, {"title": "求职领航", "kind": "个人项目 · 已有开发版本", "desc": "面向 BOSS 直聘网页版的求职辅助插件，记录岗位信息、管理沟通进度，并对照简历分析岗位匹配。", "details": "<p><strong>需求来源：</strong>自己的求职过程中，岗位信息分散，沟通后容易遗漏，简历与 JD 的重复对照也很耗时。</p><p><strong>已有能力：</strong>当前页面岗位信息提取、跳转前暂存、岗位去重、联系台账、Excel 导出与 JSON 备份；支持本地技能证据对照和可配置的模型分析。</p><p><strong>关键设计：</strong>区分按钮点击与发送成功；未知结果暂停，避免自动重发；核对 AI 引文是否出自简历与 JD 原文。</p><p><strong>当前边界：</strong>已有安装包与隔离模拟流程验证；尚未上架商店，连续翻页、批量补全 JD 和真实网站完整流程仍待完善。</p><p><strong>技术：</strong>JavaScript、Manifest V3、IndexedDB、模型 API。</p>"}, {"title": "电商 AI 智能客服与业务查询助手", "kind": "企业 AI 应用 · 2026.06—2026.08", "desc": "面向商品、订单、库存、物流与售后咨询，结合知识检索与业务工具查询，衔接 AI 应答和人工客服处理。", "details": "<p><strong>关注的问题：</strong>商品知识与动态业务数据分散，售后问题还需要在自动应答与人工处理之间顺畅交接。</p><p><strong>咨询分流：</strong>基于 LangGraph 识别并分流商品、订单、库存、物流和售后五类咨询。</p><p><strong>知识与工具协同：</strong>使用 RAG 检索商品及售后知识，通过 Function Calling 查询动态数据；模拟对接 OMS、库存和物流 API，统一查询订单、SKU 与物流状态。</p><p><strong>人工协同：</strong>针对退款、退货和投诉引入 Human-in-the-Loop，由 AI 收集信息并生成工单摘要，关键操作由人工确认。</p><p><strong>交互与验证：</strong>基于 FastAPI、React 和 SSE 实现客服管理后台与流式交互，构建 100+ 条测试用例，覆盖路由、工具调用、检索和人工接管流程。</p><p><strong>技术：</strong>Python、FastAPI、LangGraph、RAG、Function Calling、MySQL、Redis、React、SSE、Docker。</p>"}, {"title": "电商商品评价洞察与运营分析平台", "kind": "个人项目 · 2026.08—至今", "desc": "把商品评价转化为可追溯的运营洞察，支持方面级情感识别、多标签问题归类、原文证据查看与运营报告生成。", "details": "<p><strong>关注的问题：</strong>人工归类商品评价耗时，分析结论难以追溯到具体评价，统计口径也容易不一致。</p><p><strong>数据处理：</strong>基于 Pandas 清洗 CSV 与 Excel，完成字段映射、空值检查、评价去重及 SKU 关联，通过代码统一主题计数、提及率和商品维度聚合。</p><p><strong>分析编排：</strong>使用 LangGraph 串联评价解析、多标签分类、证据校验与报告生成；通过 Pydantic 校验模型输出，处理单条评价多主题、正负情感并存的情况。</p><p><strong>证据与恢复：</strong>为标签关联原文片段并校验文本来源，通过任务 ID 记录批次状态；针对超时、无效输出和遗漏记录进行有限重试，支持失败批次恢复与结果复用。</p><p><strong>交互与评测：</strong>基于 FastAPI 与 React 实现上传、进度查看、主题筛选和原文追溯；构建人工标注评测集，对比关键词基线与模型方案，评估多标签 Precision、Recall、F1 及证据有效率。</p><p><strong>技术：</strong>Python、FastAPI、LangGraph、LLM API、Pandas、Pydantic、MySQL、React、Docker。</p>"}];

function projectMedia(p){return p.images?`<div class="media has-image">${p.prototype?'<span class="reference-badge">项目原型</span>':''}<img src="${p.images[0].src}" alt="${p.images[0].alt}" loading="lazy"></div>`:'<div class="media" aria-label="项目截图预留区域"></div>'}
function gallery(p){return `<section class="screenshots" aria-label="项目实际界面">${p.images.map(image=>`<figure><a href="${image.src}" target="_blank" rel="noopener" aria-label="查看原图：${image.caption}"><img src="${image.src}" alt="${image.alt}" loading="lazy"></a><figcaption>${image.caption}<span>点击查看原图 ↗</span>${image.source?`<p class="reference-note">${image.note}</p><a class="reference-source" href="${image.source}" target="_blank" rel="noopener">来源：${image.source.replace('https://github.com/','')} ↗</a>`:''}</figcaption></figure>`).join('')}</section>`}

const personalNote="<section class=\"personal-note\" id=\"note\" aria-labelledby=\"note-title\"><div class=\"section-head\"><h2 id=\"note-title\">一点想法</h2></div><article class=\"note-body\"><blockquote>且视他人之疑目如盏盏鬼火，大胆去走你的夜路</blockquote><p>第一份工作结束后，我经历了一段比较长的职业迷茫期。纯粹的软件工程师工作并没有给我带来太多成就感。每次项目结束，我更多感受到的不是完成一件事后的满足，而是“终于松了一口气”。离职之后，我开始认真思考：难道我真的要以这样的状态，度过职业生涯中非常重要的一段时期吗？</p><p><strong>我不甘心。</strong></p><p>于是，我开始主动寻找答案，大量学习和阅读，从前端到后端不断拓展自己的技术边界。恰逢 AI 开始快速发展，我也因为焦虑而接触 AI，但在这个过程中，我意外发现了自己真正感兴趣的事情——研究 AI、设计 Skills 和提示词，并通过 AI 帮助别人解决实际问题。相比单纯完成代码，我更享受的是理解一个需求、找到解决方案，并最终看到它真正产生效果的过程。</p><p>与此同时，我也曾帮助朋友运营小红书账号和视频内容。在这个过程中，我发现自己对用户需求、内容方向和市场变化有比较敏锐的感知，也能够快速发现问题并提出具有实际效果的建议。</p><p>这些经历让我逐渐意识到，也许我真正感兴趣的并不只是“把技术做出来”，而是分析和解决问题，正好是 AI 应用 / 运营 / 产品要做的事。</p><p>再结合过去工作中领导曾评价我“对需求和形势比较敏锐，很适合产品 / 运营类工作”，我开始重新认识自己的优势，也逐渐确定了下一阶段的职业方向——从纯粹的软件开发，转向更偏 AI 应用、产品与业务落地的方向。</p><p>这大概就是我浅薄工作经历所有的故事，<strong>由衷感谢每一位有耐心看到这里的 HR、领导</strong>。本来想祝愿：</p><blockquote>长风破浪会有时，直挂云帆济沧海</blockquote><p>然而过于狂傲肆意反而会让人增添惆怅，最后还是送上我最爱的这首：</p><blockquote>竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。</blockquote><p class=\"note-ending\"><strong>纵有风雨，也能从容前行，自在生活。</strong></p></article></section>";
const contactSection="<section class=\"contact-section contact-cards-section\" id=\"contact\" aria-labelledby=\"contact-title\"><h2 id=\"contact-title\">联系方式</h2><div class=\"contact-grid\"><div class=\"contact-card\"><h3>邮箱</h3><a href=\"mailto:2801813442@qq.com\">2801813442@qq.com</a><button type=\"button\" onclick=\"copyContactValue(this,'2801813442@qq.com')\">复制邮箱</button><span role=\"status\" aria-live=\"polite\"></span></div><div class=\"contact-card\"><h3>微信</h3><span class=\"contact-value\">2801813442</span><button type=\"button\" onclick=\"copyContactValue(this,'2801813442')\">复制微信</button><span role=\"status\" aria-live=\"polite\"></span></div><div class=\"contact-card\"><h3>手机</h3><a href=\"tel:17328092043\">17328092043</a><button type=\"button\" onclick=\"copyContactValue(this,'17328092043')\">复制号码</button><span role=\"status\" aria-live=\"polite\"></span></div></div><p class=\"contact-invitation\">做 AI 落地、AI 产品，或想聊聊“能用但没人用”的项目，都欢迎找我。</p></section>";

function projectEntry(p,i){return `<article class="project-entry" id="project/${i}"><div class="project">${projectMedia(p)}<span class="kind">${p.kind}</span><h3>${p.title}</h3><p>${p.desc}</p></div><details class="project-expansion"><summary>查看项目详情</summary><div class="expanded-body"><p><a class="text-link" href="${p.prd}" target="_blank" rel="noopener">产品需求文档（PRD） ↗</a></p>${p.details}<h4>${p.prototype?'界面与交互原型':'项目界面'}</h4>${p.prototype?`<p class="reference-intro">根据项目功能制作的原创交互原型，使用示例数据展示操作流程。</p><p><a class="primary" href="${p.demo}" target="_blank" rel="noopener">打开交互原型</a></p>`:''}${gallery(p)}</div></details></article>`}
const experienceSection="<section id=\"experience\" class=\"experience-section\" aria-labelledby=\"experience-title\"><div class=\"section-head\"><h2 id=\"experience-title\">工作经历</h2></div><div class=\"experience-timeline\"><article class=\"experience-item\"><p class=\"experience-date\">2026.06 — 2026.08</p><h3>悍高集团股份有限公司 · AI 技术工程师</h3><ul><li>探索并落地内部 AI 场景，设计 AI Agent、AI Skill 与智能工作流。</li><li>搭建企业智能助手、知识问答等应用，连接业务与技术。</li><li>负责内部推广与培训，推动 AI 真正被用起来。</li></ul></article><article class=\"experience-item\"><p class=\"experience-date\">2023.06 — 2025.07</p><h3>广联科技有限公司 · 软件工程师</h3><ul><li>嵌入式软件开发与软硬件联调，覆盖需求分析、系统调试到工程化交付。</li><li>跨团队协作推进产品研发与问题定位。</li></ul></article><article class=\"experience-item\"><p class=\"experience-date\">2017.09 — 2022.07 · 教育背景</p><h3>厦门大学嘉庚学院 · 信息与计算科学 · 本科</h3><div class=\"campus-gallery\"><a href=\"assets/campus/campus.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/campus/campus.jpg\" alt=\"校园湖畔建筑与远山\" loading=\"lazy\"></a><a href=\"assets/campus/campus-2.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/campus/campus-2.jpg\" alt=\"校园绿树与蓝天\" loading=\"lazy\"></a><a href=\"assets/campus/campus-3.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/campus/campus-3.jpg\" alt=\"校园红瓦建筑与空中的月亮\" loading=\"lazy\"></a></div></article></div></section>";

app.innerHTML=`<section id="about" class="onepage-about personal-about" aria-labelledby="about-title"><div class="section-head"><h2 id="about-title">关于我</h2><span>工作与生活里的我</span></div><div class="personal-layout"><div class="personal-photos"><figure class="portrait-main"><a href="assets/personal/grad-polaroid.jpg" target="_blank" rel="noopener" aria-label="查看毕业拍立得原图"><img src="assets/personal/grad-polaroid.jpg" alt="周玉冰的毕业拍立得照片" loading="lazy"></a><figcaption>一个毕业时刻，留在相纸里。</figcaption></figure><figure class="portrait-memory"><a href="assets/personal/grad-field.jpg" target="_blank" rel="noopener" aria-label="查看草地毕业合影原图"><img src="assets/personal/grad-field.jpg" alt="校园草地上的毕业合影" loading="lazy"></a><figcaption>那天的阳光很好。</figcaption></figure></div><div class="personal-copy"><h3>你好，我是周玉冰。</h3><p class="personal-lead">从软件开发走向 AI 应用，<br>喜欢把问题想清楚，再把想法做出来。</p><p>我有软件开发与企业 AI 应用经历，关注知识问答、智能工作流和产品体验。相比单纯完成代码，我更享受理解一个需求、找到合适方案，再看到它真正产生效果的过程。</p><p>最近在实践求职辅助、电商智能客服与商品评价分析。也希望把对需求的敏感和工程经验，放进更多实际业务里。</p><div class="personal-interests"><h4>工作之外</h4><div class="interest-line"><span class="interest-symbol" aria-hidden="true">↗</span><div><h5>阅读</h5><p>从书里寻找新的视角，也寻找自己的答案。</p></div></div><div class="interest-line"><svg class="interest-symbol" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M8 24C8 15 13 7 23 4c1 12-4 18-15 16M8 20l10-10M8 24l-3-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><div><h5>热带植物</h5><p>喜欢叶片的形态，和慢慢生长的生命力。</p></div></div><div class="interest-line"><svg class="interest-symbol" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 13V5l7 4h4l7-4v8c3 9-3 12-9 12S2 22 5 13Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M10 16h.1M18 16h.1M13 20h2M4 19l-3-1m23 1 3-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div><h5>猫</h5><p>工作之外，也想给生活留一点柔软。</p></div></div></div></div></div></section><section id="projects" class="all-projects" aria-labelledby="projects-title"><div class="page-title"><span class="eyebrow">项目与实践</span><h1 id="projects-title">从实际问题出发。</h1><p>企业 AI 应用与个人工具，连接需求、技术和使用体验。</p></div><div class="projects">${projects.map(projectEntry).join('')}</div></section>${experienceSection}${personalNote}${contactSection}`;
function navigateSection(){let hash=decodeURIComponent(location.hash.slice(1))||'home';if(hash==='selected')hash='projects';if(hash.startsWith('project/')){const entry=document.getElementById(hash);if(entry)entry.querySelector('details').open=true;else hash='projects'}const target=hash==='home'?document.getElementById('lilyOpening'):document.getElementById(hash);if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'}));}
addEventListener('hashchange',navigateSection);
document.querySelector('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.hash===location.hash){e.preventDefault();navigateSection()}});
const sections=['home','about','projects','experience','note','contact'];
let scrollQueued=false;addEventListener('scroll',()=>{if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{let current='home';for(const id of sections.slice(1)){if(document.getElementById(id).getBoundingClientRect().top<=150)current=id}document.querySelectorAll('nav a').forEach(a=>{const active=a.hash==='#'+current;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')});scrollQueued=false})},{passive:true});
document.title='周玉冰 — 项目与实践';navigateSection();
</script></body></html>
