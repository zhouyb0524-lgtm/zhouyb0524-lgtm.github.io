<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商智能客服工作台 · 项目原型</title><style>*{box-sizing:border-box}body{margin:0;color:#213442;background:#f2f5f7;font:14px/1.65 'Microsoft YaHei UI','Segoe UI',sans-serif}button,input,select{font:inherit}button,a,select{cursor:pointer}button{border:1px solid #d7e0e6;background:white;border-radius:6px;padding:8px 14px;color:inherit}button:hover{border-color:#16877e}button:focus-visible,a:focus-visible{outline:3px solid #e6ae43;outline-offset:3px}.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}.sidebar{background:#183740;color:#b8ced1;padding:28px 20px}.brand{font-size:23px;font-weight:700;color:white;letter-spacing:1px;margin-bottom:38px}.brand small{font-size:11px;display:block;font-weight:400;color:#9bbabc;letter-spacing:0}.nav{padding:11px 13px;margin:7px 0;border-radius:6px}.nav.active{background:#2c5259;color:white}.sidebar footer{margin-top:55px;font-size:11px;color:#92b0b5}.main{padding:27px 32px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{font-size:25px;margin:0}.sub{font-size:12px;color:#74858e}.badge{font-size:12px;background:#e2f0ed;color:#267368;border-radius:5px;padding:5px 10px}.panel{background:white;border:1px solid #dfe7eb;border-radius:9px;overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid #e7edef;display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:15px;margin:0}.muted{color:#7b8c95}.tag{display:inline-block;font-size:11px;border-radius:4px;padding:2px 7px;background:#eaf3f1;color:#247b70}.tag.amber{background:#fff3db;color:#9b6d12}.primary{background:#167c72;color:white;border-color:#167c72}.note{font-size:12px;color:#71838b;margin-top:17px}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}.metric{padding:19px 22px;background:white;border:1px solid #dfe7eb;border-radius:8px}.metric strong{display:block;font-size:30px;margin-top:6px;font-weight:600}.metric span{color:#73858f;font-size:12px}.split{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}.row{display:flex;justify-content:space-between;align-items:center}.pill{border:0;border-radius:20px;font-size:12px;padding:5px 12px}.pill.active{background:#183740;color:white}.bar{height:9px;background:#edf2f4;border-radius:5px;margin:9px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:#31988c;border-radius:5px}.body{padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #e9eef0}th{color:#7a8c96;font-weight:400}.evidence{background:#f5f8f9;border-left:3px solid #31988c;padding:14px;margin-top:16px;font-size:13px}.status{font-size:12px;color:#237c6e}a{color:#24766d} @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:20px}.split{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.top{gap:12px;align-items:flex-start}.top h1{font-size:22px}}</style></head><body><style>.workspace{display:grid;grid-template-columns:245px minmax(280px,1fr) 285px;gap:16px}.session{display:block;width:100%;border:0;border-radius:0;text-align:left;padding:18px;border-bottom:1px solid #e9eef0}.session.active{background:#edf7f4;border-left:3px solid #218b7c}.session strong{display:block;margin:6px 0}.bubble{padding:14px 17px;border-radius:9px;background:#f0f3f5;max-width:90%;margin:20px 0}.bubble.answer{background:#e6f4ef;margin-left:auto}.chat{padding:20px;min-height:400px}.trace{margin:22px 0;padding:14px;border:1px dashed #afcfc6;border-radius:7px;font-size:12px;color:#48776b}.compose{display:flex;gap:8px;padding:16px;border-top:1px solid #e9eef0}.compose input{min-width:0;flex:1;border:1px solid #dbe4e7;border-radius:5px;padding:10px}.facts{display:grid;grid-template-columns:85px 1fr;gap:15px;margin:20px 0;font-size:12px}.facts dt{color:#81929b}.facts dd{margin:0}.timeline{border-left:2px solid #cee3dc;padding-left:15px;margin:23px 0;font-size:12px}.timeline p{margin:20px 0}@media(max-width:1150px){.workspace{grid-template-columns:190px 1fr}.context{grid-column:1/-1}}@media(max-width:650px){.workspace{grid-template-columns:1fr}.context{grid-column:auto}}</style><div class="shell"><aside class="sidebar"><div class="brand">问舟<small>周玉冰 · 项目原型</small></div><div class="nav active">会话中心</div><div class="nav">业务工作台</div><div class="nav">知识与规则</div><footer>交互原型 / 示例数据<br>用于展示产品方案</footer></aside><main class="main"><div class="top"><div><h1>客服会话中心</h1><div class="sub">知识问答、业务查询与人工协同</div></div><span class="badge">项目原型 · 示例数据</span></div><div class="metric-grid"><div class="metric"><span>当前会话</span><strong>12</strong></div><div class="metric"><span>AI 处理中</span><strong>8</strong></div><div class="metric"><span>待人工确认</span><strong>3</strong></div><div class="metric"><span>今日已完成</span><strong>46</strong></div></div><div class="workspace"><section class="panel"><div class="panel-head"><h2>会话队列</h2><span class="sub">12 条</span></div><button class="session active" data-mode="order"><span class="tag">物流查询</span><strong>林女士</strong><span class="sub">我的订单什么时候能到？</span></button><button class="session" data-mode="refund"><span class="tag amber">售后处理</span><strong>陈先生</strong><span class="sub">收到的商品有破损，想退款</span></button><button class="session" data-mode="product"><span class="tag">商品咨询</span><strong>许女士</strong><span class="sub">这款花洒支持恒温吗？</span></button></section><section class="panel"><div class="panel-head"><h2 id="customer">林女士</h2><span class="status" id="state">AI 处理中</span></div><div class="chat" id="chat"></div><form class="compose" id="reply"><input aria-label="回复内容" placeholder="输入回复，或补充处理建议"><button class="primary">发送</button></form></section><section class="panel context"><div class="panel-head"><h2>业务查询</h2><span class="tag">工具结果</span></div><div class="body"><div class="row"><strong id="contextTitle">订单与物流</strong><span class="sub">模拟接口</span></div><dl class="facts" id="facts"></dl><div class="timeline" id="timeline"></div><button id="handoff" style="width:100%">转人工处理</button><p class="sub" id="handoff-note">关键售后操作需人工确认。</p></div></section></div><p class="note">项目原型：当前会话、业务信息与处理数量均为示例数据；不连接真实业务系统。</p></main></div><script>const data={order:{name:'林女士',question:'你好，我昨天买的恒温花洒，能帮我看一下什么时候送到吗？',trace:'识别意图：物流查询 → 查询订单 → 查询物流',answer:'查询到示例订单已发出，目前包裹已到达广州分拨中心，预计明日送达。你可以在订单详情中继续查看物流更新。',title:'订单与物流',facts:['订单编号','DEMO20261026001','商品','恒温花洒套装 × 1','订单状态','已发货','物流状态','运输中'],steps:['今日 09:42 · 到达广州分拨中心','昨日 18:20 · 商家已发货']},refund:{name:'陈先生',question:'收到的商品外壳有破损，我想申请退款。',trace:'识别意图：售后退款 → 收集信息 → 等待人工确认',answer:'我会协助整理售后信息。请提供破损位置的照片，并确认外包装是否完整；退款申请将交由人工客服核实处理。',title:'售后工单摘要',facts:['工单编号','DEMO-AF002','问题类型','商品破损','资料状态','待补充照片','处理状态','待人工核实'],steps:['已记录 · 商品破损诉求','下一步 · 人工核实退款申请']},product:{name:'许女士',question:'这款花洒支持恒温吗？家里有小孩，比较在意水温。',trace:'识别意图：商品咨询 → 检索产品知识 → 生成回答',answer:'示例商品支持恒温调节，并设有温度安全锁。具体适用水压、安装条件和安全使用说明，可在对应产品说明书中确认。',title:'商品知识',facts:['商品编号','DEMO-SKU008','品类','恒温花洒','检索内容','温度控制与安装条件','知识来源','示例产品说明书'],steps:['知识检索 · 温度安全说明','回答依据 · 示例产品说明书']}};
function show(mode){const x=data[mode];document.querySelectorAll('.session').forEach(e=>e.classList.toggle('active',e.dataset.mode===mode));document.getElementById('customer').textContent=x.name;document.getElementById('state').textContent=mode==='refund'?'待人工确认':'AI 处理中';document.getElementById('chat').innerHTML='<div class="sub">客户消息</div><div class="bubble">'+x.question+'</div><div class="trace">'+x.trace+'</div><div class="bubble answer">'+x.answer+'</div><div class="sub" style="text-align:right">AI 助手 · 示例回复</div>';document.getElementById('contextTitle').textContent=x.title;document.getElementById('facts').innerHTML=x.facts.map((v,i)=>i%2?'<dd>'+v+'</dd>':'<dt>'+v+'</dt>').join('');document.getElementById('timeline').innerHTML=x.steps.map(s=>'<p>'+s+'</p>').join('');document.getElementById('handoff').disabled=false;document.getElementById('handoff').textContent='转人工处理';}document.querySelectorAll('.session').forEach(e=>e.onclick=()=>show(e.dataset.mode));document.getElementById('handoff').onclick=function(){this.textContent='已加入人工队列';this.disabled=true;document.getElementById('state').textContent='人工待接管';document.getElementById('handoff-note').textContent='已生成示例工单摘要，等待人工接管。'};document.getElementById('reply').onsubmit=e=>{e.preventDefault();const input=e.target.querySelector('input');if(input.value.trim()){const bubble=document.createElement('div');bubble.className='bubble answer';bubble.textContent=input.value;document.getElementById('chat').append(bubble);input.value=''}};show('order');</script></body></html>
